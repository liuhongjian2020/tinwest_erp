services:
  - type: web
    name: tinwest-erp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tinwest-erp-db
          property: connectionString

databases:
  - name: tinwest-erp-db
    plan: free